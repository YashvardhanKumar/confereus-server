name: confereus

services:
  mongodb:
    image: mongo:7.0
    container_name: confereus-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { if (rs.status().ok === 1) quit(0); } catch(e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongodb:27017\"}]}); } quit(0);'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - mongo-data:/data/db
    networks:
      - confereus-network
    deploy:
      resources:
        limits:
          memory: 300M

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: confereus-server:latest
    container_name: confereus-server
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/confereus?replicaSet=rs0}
      - FROM_NAME=${FROM_NAME:-Confereus}
      - FROM_EMAIL=${FROM_EMAIL}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - REDIRECT_URL=${REDIRECT_URL:-https://confereus.codeflip.co.in/signin-linkedin}
      - SCOPE=${SCOPE:-r_liteprofile%20r_emailaddress}
      - STATE=${STATE:-123456}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - uploads-data:/app/uploads
    networks:
      - confereus-network
    deploy:
      resources:
        limits:
          memory: 256M

  worker:
    image: confereus-server:latest
    container_name: confereus-worker
    restart: unless-stopped
    command: ["node", "dist/worker/notification.worker.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/confereus?replicaSet=rs0}
      - FROM_NAME=${FROM_NAME:-Confereus}
      - FROM_EMAIL=${FROM_EMAIL}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-30000}
    depends_on:
      server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - confereus-network
    deploy:
      resources:
        limits:
          memory: 128M

  nginx:
    image: nginx:alpine
    container_name: confereus-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads-data:/var/www/uploads:ro
    depends_on:
      server:
        condition: service_healthy
    networks:
      - confereus-network
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  mongo-data:
  uploads-data:

networks:
  confereus-network:
    driver: bridge
