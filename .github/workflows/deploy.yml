name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  release:
    types: [published]

jobs:
  code-quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Lint Check
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: TypeScript Build Check
        run: npm run build

      - name: Run Test Suite
        run: npm test

  deploy:
    name: Deploy to EC2
    needs: code-quality
    if: (github.event_name == 'release' && github.event.action == 'published') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Runner Public IP
        id: ip
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "ip=$RUNNER_IP" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

      - name: Add runner IP to Security Group
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SG_ID != ''
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port ${{ secrets.EC2_PORT || 22 }} \
            --cidr ${{ steps.ip.outputs.ip }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SG_ID: ${{ secrets.AWS_SG_ID }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || 'ec2-13-203-127-127.ap-south-1.compute.amazonaws.com' }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          command_timeout: 20m
          script: |
            echo "🚀 Starting Confereus deployment..."
            # Navigate to deployment directory on EC2
            cd ${{ secrets.EC2_DEPLOY_DIR || '~/confereus-server' }}
            
            # Make the deployment script executable and run it
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
            echo "✅ Deployment finished successfully!"

      - name: Revoke runner IP from Security Group
        if: always() && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SG_ID != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port ${{ secrets.EC2_PORT || 22 }} \
            --cidr ${{ steps.ip.outputs.ip }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SG_ID: ${{ secrets.AWS_SG_ID }}
